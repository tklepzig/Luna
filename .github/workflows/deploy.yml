name: Deploy to luna-hub

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
        working-directory: hub
      - run: npm run build
        working-directory: hub
      - name: Push to luna-hub
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: "hub/dist"
          destination-github-username: "tklepzig"
          destination-repository-name: "luna-hub"
          user-email: deploy@luna
          target-branch: master
